name: admin-verify-service-ci-cd

on:
  push:
    branches: [develop, main, 'feature/**']
    paths:
      - 'services/AdminVerifyService/**'
      - 'services/AdminVerifyService.Tests/**'
      - '.github/workflows/admin-verify-service-ci-cd.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Java for SonarQube
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SonarScanner for .NET
        run: dotnet tool install dotnet-sonarscanner --tool-path "$RUNNER_TEMP/sonar-scanner" --version 11.3.0

      - run: dotnet restore services/AdminVerifyService
      - run: dotnet restore services/AdminVerifyService.Tests

      - name: Begin Admin Verify analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "$RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner" begin \
            /o:"it24103447" \
            /k:"it24103447_lostandfoundapp" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="services/AdminVerifyService.Tests/TestResults/**/coverage.opencover.xml" \
            /d:sonar.scanner.scanAll=false \
            /d:sonar.dotnet.excludeTestProjects=true \
            /d:sonar.qualitygate.wait=true

      - run: dotnet build services/AdminVerifyService --no-restore --no-incremental
      - run: dotnet build services/AdminVerifyService.Tests --no-restore --no-incremental

      - name: Test Admin Verify with OpenCover coverage
        run: dotnet test services/AdminVerifyService.Tests --no-build --collect:"XPlat Code Coverage;Format=opencover"

      - name: Finish analysis and check Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "$RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner" end \
            /d:sonar.token="$SONAR_TOKEN"

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet publish services/AdminVerifyService -c Release -o services/AdminVerifyService/publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'lostfound-adminverify-service'
          publish-profile: ${{ secrets.AZURE_ADMIN_VERIFY_SERVICE_PUBLISH_PROFILE }}
          package: services/AdminVerifyService/publish