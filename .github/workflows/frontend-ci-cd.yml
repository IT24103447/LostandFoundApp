name: frontend-ci-cd
on:
  push:
    branches: [develop, main, 'feature/**']
    paths: ['frontend/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          VITE_AUTH_API_BASE_URL: https://lostfound-auth-service.azurewebsites.net
          VITE_ITEM_API_BASE_URL: http://localhost:5001
          VITE_MATCHING_API_BASE_URL: http://localhost:5002
          VITE_ADMIN_API_BASE_URL: http://localhost:5003

      - name: List dist contents (debug)
        run: ls -la frontend/dist

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend/dist"
          output_location: ""
          skip_app_build: true