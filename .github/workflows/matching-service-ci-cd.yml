name: matching-service-ci-cd
on:
  push:
    branches: [develop, main, 'feature/**']
    paths: ['services/MatchingService/**', 'services/MatchingService.Tests/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore services/MatchingService
      - run: dotnet restore services/MatchingService.Tests
      - run: dotnet build services/MatchingService --no-restore
      - run: dotnet build services/MatchingService.Tests --no-restore
      - run: dotnet test services/MatchingService.Tests --no-build --collect:"XPlat Code Coverage"

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish services/MatchingService -c Release -o services/MatchingService/publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'lostfound-matching-service'
          publish-profile: ${{ secrets.AZURE_MATCHING_SERVICE_PUBLISH_PROFILE }}
          package: services/MatchingService/publish