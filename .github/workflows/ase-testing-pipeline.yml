name: ASE testing pipeline

on:
  push:
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'testing-pipeline/**'
      - 'global.json'
      - '.github/workflows/ase-testing-pipeline.yml'

  pull_request:
    branches: [develop, main]
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'testing-pipeline/**'
      - 'global.json'
      - '.github/workflows/ase-testing-pipeline.yml'

  workflow_dispatch:
    inputs:
      category:
        description: Testing category (mutation also runs the unit baseline)
        type: choice
        default: all
        options:
          - all
          - unit-testing
          - mutation-testing
          - load-testing
          - ui-e2e-testing
      mode:
        description: Development allows unfinished suites; strict requires all selected suites
        type: choice
        default: development
        options:
          - development
          - strict

# Set repository variable ASE_PIPELINE_MODE=strict once the assessment suites are ready.
env:
  ASE_PIPELINE_MODE: ${{ inputs.mode || vars.ASE_PIPELINE_MODE || 'development' }}

permissions:
  contents: read

concurrency:
  group: ase-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    if: >-
      ${{
        github.event_name != 'workflow_dispatch' ||
        inputs.category == 'all' ||
        inputs.category == 'unit-testing' ||
        inputs.category == 'mutation-testing'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      baseline: ${{ steps.tests.outcome == 'success' && 'passed' || 'unavailable' }}

    steps:
      - name: Initialize temporary directories
        run: |
          case "$ASE_PIPELINE_MODE" in
            development|strict) ;;
            *) echo 'Invalid ASE_PIPELINE_MODE; use development or strict.' >&2; exit 1 ;;
          esac
          echo "ASE_REPORT_ROOT=$RUNNER_TEMP/ase-reports" >> "$GITHUB_ENV"
          echo "ASE_RUNTIME_DIR=$RUNNER_TEMP/ase-environment" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Check unit suite readiness
        id: readiness
        run: |
          readiness=0
          bash testing-pipeline/unit-testing/run.sh --check-ready || readiness=$?
          if [[ "$readiness" == 0 ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif [[ "$readiness" == 78 ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            result=0
            bash testing-pipeline/unit-testing/run.sh || result=$?
            if [[ "$result" != 78 || "$(cat "$ASE_REPORT_ROOT/unit-testing/status.txt")" != not-implemented ]]; then
              echo 'Unexpected failure while recording the unfinished suite.' >&2
              exit 1
            fi
            if [[ "$ASE_PIPELINE_MODE" == strict ]]; then exit 78; fi
            echo 'Development mode: unit tests are not implemented; no passing baseline exists.'
          else
            exit "$readiness"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.readiness.outputs.ready == 'true' && success()
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        if: steps.readiness.outputs.ready == 'true' && success()
        with:
          node-version: '22.14.0'

      - name: Run assessment unit tests
        id: tests
        if: steps.readiness.outputs.ready == 'true' && success()
        run: bash testing-pipeline/unit-testing/run.sh

      - name: Save results even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ase-unit-testing
          path: ${{ runner.temp }}/ase-reports/
          if-no-files-found: warn
          retention-days: 14

  other-categories:
    needs: unit
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        category:
          - mutation-testing
          - load-testing
          - ui-e2e-testing

    env:
      ASE_CATEGORY: ${{ matrix.category }}
      ASE_REQUESTED: ${{ inputs.category || 'all' }}
      ASE_UNIT_RESULT: ${{ needs.unit.result }}
      ASE_UNIT_BASELINE: ${{ needs.unit.outputs.baseline }}
      ASE_COMPOSE_PROJECT: ase-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}

    steps:
      - name: Initialize temporary directories
        run: |
          case "$ASE_PIPELINE_MODE" in
            development|strict) ;;
            *) echo 'Invalid ASE_PIPELINE_MODE; use development or strict.' >&2; exit 1 ;;
          esac
          echo "ASE_REPORT_ROOT=$RUNNER_TEMP/ase-reports" >> "$GITHUB_ENV"
          echo "ASE_RUNTIME_DIR=$RUNNER_TEMP/ase-environment" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Select category and check prerequisites
        id: selection
        run: |
          if [[ "$ASE_REQUESTED" != all && "$ASE_REQUESTED" != "$ASE_CATEGORY" ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$ASE_REPORT_ROOT/$ASE_CATEGORY"
          echo 'active=true' >> "$GITHUB_OUTPUT"

          readiness=0
          bash "testing-pipeline/$ASE_CATEGORY/run.sh" --check-ready || readiness=$?
          if [[ "$readiness" == 78 ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            result=0
            bash "testing-pipeline/$ASE_CATEGORY/run.sh" || result=$?
            if [[ "$result" != 78 || "$(cat "$ASE_REPORT_ROOT/$ASE_CATEGORY/status.txt")" != not-implemented ]]; then
              echo 'Unexpected failure while recording the unfinished suite.' >&2
              exit 1
            fi
            if [[ "$ASE_PIPELINE_MODE" == strict ]]; then exit 78; fi
            echo "Development mode: $ASE_CATEGORY is not implemented; no tests were run."
            exit 0
          elif [[ "$readiness" != 0 ]]; then
            echo "Category readiness check failed with exit code $readiness." >&2
            exit "$readiness"
          fi

          if [[ "$ASE_CATEGORY" == mutation-testing && "$ASE_UNIT_BASELINE" != passed ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Mutation analysis requires an executed, passing assessment unit baseline.' \
              > "$ASE_REPORT_ROOT/$ASE_CATEGORY/summary.md"
            if [[ "$ASE_PIPELINE_MODE" == development && "$ASE_UNIT_RESULT" == success ]]; then
              echo blocked-not-implemented > "$ASE_REPORT_ROOT/$ASE_CATEGORY/status.txt"
              echo 'Development mode: mutation waits for the unfinished unit suite.'
              exit 0
            fi
            echo blocked > "$ASE_REPORT_ROOT/$ASE_CATEGORY/status.txt"
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        if: steps.selection.outputs.ready == 'true' && success()
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        if: steps.selection.outputs.ready == 'true' && success()
        with:
          node-version: '22.14.0'

      - name: Cache JMeter
        id: jmeter-cache
        if: steps.selection.outputs.ready == 'true' && matrix.category == 'load-testing' && success()
        uses: actions/cache@v4
        with:
          path: ~/.cache/ase-load-testing
          key: ${{ runner.os }}-jmeter-${{ hashFiles('testing-pipeline/load-testing/run.sh') }}

      - name: Download JMeter
        if: steps.selection.outputs.ready == 'true' && matrix.category == 'load-testing' && steps.jmeter-cache.outputs.cache-hit != 'true' && success()
        run: |
          version=$(sed -n 's/^JMETER_VERSION=//p' testing-pipeline/load-testing/run.sh)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Could not read the JMeter version.' >&2; exit 1; }
          echo "ASE_JMETER_VERSION=$version" >> "$GITHUB_ENV"
          archive="apache-jmeter-$version.tgz"
          cache_dir="$HOME/.cache/ase-load-testing"
          url="https://archive.apache.org/dist/jmeter/binaries/$archive"
          mkdir -p "$cache_dir"
          cd "$cache_dir"
          curl --fail --silent --show-error --location --retry 3 -o "$archive" "$url"
          curl --fail --silent --show-error --location --retry 3 -o "$archive.sha512" "$url.sha512"
          sha512sum -c "$archive.sha512"

      - name: Extract JMeter
        if: steps.selection.outputs.ready == 'true' && matrix.category == 'load-testing' && steps.jmeter-cache.outputs.cache-hit != 'true' && success()
        run: |
          archive="apache-jmeter-$ASE_JMETER_VERSION.tgz"
          cache_dir="$HOME/.cache/ase-load-testing"
          cd "$cache_dir"
          tar -xzf "$archive"
          test -x "apache-jmeter-$ASE_JMETER_VERSION/bin/jmeter"
          rm -f "$archive" "$archive.sha512"

      - name: Start shared application environment
        if: >-
          steps.selection.outputs.ready == 'true' &&
          matrix.category != 'mutation-testing' &&
          success()
        run: bash testing-pipeline/shared/start-environment.sh start

      - name: Seed shared application environment
        if: >-
          steps.selection.outputs.ready == 'true' &&
          matrix.category != 'mutation-testing' &&
          success()
        run: |
          source "$ASE_RUNTIME_DIR/environment.sh"
          bash testing-pipeline/shared/seed-test-data.sh "$ASE_CATEGORY"

      - name: Run category
        if: steps.selection.outputs.ready == 'true' && success()
        run: |
          if [[ -f "$ASE_RUNTIME_DIR/environment.sh" ]]; then
            source "$ASE_RUNTIME_DIR/environment.sh"
          fi

          bash "testing-pipeline/$ASE_CATEGORY/run.sh"

      - name: Stop environment and retain logs
        if: >-
          always() &&
          steps.selection.outputs.ready == 'true' &&
          matrix.category != 'mutation-testing'
        run: bash testing-pipeline/shared/start-environment.sh stop

      - name: Record setup failures
        if: always() && steps.selection.outputs.active == 'true'
        run: |
          mkdir -p "$ASE_REPORT_ROOT/$ASE_CATEGORY"

          if [[ ! -f "$ASE_REPORT_ROOT/$ASE_CATEGORY/status.txt" ]]; then
            echo failed > "$ASE_REPORT_ROOT/$ASE_CATEGORY/status.txt"
            echo 'The category did not finish. Inspect the setup steps and application logs.' \
              > "$ASE_REPORT_ROOT/$ASE_CATEGORY/summary.md"
          fi

      - name: Save reports and application logs
        if: always() && steps.selection.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ase-${{ matrix.category }}
          path: |
            ${{ runner.temp }}/ase-reports/
            ${{ runner.temp }}/ase-environment/logs/
          if-no-files-found: warn
          retention-days: 14

  summary:
    needs: [unit, other-categories]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      ASE_REQUESTED: ${{ inputs.category || 'all' }}
      ASE_UNIT_RESULT: ${{ needs.unit.result }}
      ASE_OTHER_RESULT: ${{ needs.other-categories.result }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ase-*
          path: collected
          merge-multiple: true

      - name: Publish combined summary and final result
        run: |
          mkdir -p collected

          echo '## ASE assessment testing results' >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: **$ASE_PIPELINE_MODE**" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Category | Status |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"

          failed=0
          incomplete=0

          for category in unit-testing mutation-testing load-testing ui-e2e-testing; do
            if [[ "$ASE_REQUESTED" != all &&
                  "$ASE_REQUESTED" != "$category" &&
                  !( "$ASE_REQUESTED" == mutation-testing &&
                     "$category" == unit-testing ) ]]; then
              echo "| $category | Not selected |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            status_file=$(find collected -type f \
              -path "*/$category/status.txt" -print -quit)

            if [[ -n "$status_file" ]]; then
              status=$(cat "$status_file")
              echo "| $category | $status |" >> "$GITHUB_STEP_SUMMARY"
              case "$status" in
                passed) ;;
                not-implemented|blocked-not-implemented)
                  incomplete=$((incomplete + 1))
                  if [[ "$ASE_PIPELINE_MODE" != development ]]; then failed=1; fi
                  ;;
                *) failed=1 ;;
              esac
            else
              echo "| $category | No result (setup failure or cancellation) |" \
                >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done

          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the ase-* artifacts on this run for category summaries, detailed reports, and available application logs.' \
            >> "$GITHUB_STEP_SUMMARY"

          for result in "$ASE_UNIT_RESULT" "$ASE_OTHER_RESULT"; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              failed=1
            fi
          done

          if (( incomplete > 0 )); then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo "**Assessment incomplete:** $incomplete selected categories did not execute. Development success does not mean all tests passed. Use strict mode for assessment validation." >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$ASE_PIPELINE_MODE" in
            development|strict) ;;
            *) failed=1 ;;
          esac
          exit "$failed"
