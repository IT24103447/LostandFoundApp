# Load profile for plans/lost-and-found-load.jmx (about 60 seconds by default).
# Any value can be overridden at run time with -J<name>=<value>.

# Steady users: ramp up one by one, then hold the peak.
steady_users=20
steady_ramp_seconds=20
steady_peak_seconds=25

# Spike users: start together right after the steady phase, with no think time.
spike_users=20
spike_ramp_seconds=1
spike_seconds=15

# Admin: one thread for the whole run.
admin_users=1
admin_seconds=60

# Think time between user steps (uniform random, milliseconds).
think_min_ms=500
think_max_ms=1500
admin_think_ms=2000

# Live console progress (per service and overall) every N seconds while the test runs.
summariser.interval=5
